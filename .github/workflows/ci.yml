name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) no longer publishes Python 3.9 binaries.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests
        run: make test
      - name: End-to-end acceptance
        run: make accept
      - name: Build and install console script
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          gitfield --version
